name: Build BotBuddy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore "BOTBUDDY CYBERSECURITY CHATBOT.csproj"

    - name: Build the project
      run: dotnet build "BOTBUDDY CYBERSECURITY CHATBOT.csproj" --configuration Release --no-restore
